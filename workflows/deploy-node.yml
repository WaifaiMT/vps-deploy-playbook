# Tests and builds a Node.js or Next.js app, then deploys it with scripts/deploy.sh.
# The server installs production dependencies and PM2 reloads the app.
# Copy to .github/workflows/deploy.yml in your app's repo.
#
# Uses the same secrets and variables as deploy-static.yml (VPS_HOST, VPS_USER,
# VPS_SSH_KEY, VPS_KNOWN_HOSTS, APP_NAME, HEALTH_URL), plus:
#   PM2_NAME   optional variable; defaults to APP_NAME
#
# Staging: copy this file as deploy-staging.yml, trigger it on the `staging`
# branch, and point APP_NAME/HEALTH_URL at a `staging` GitHub environment.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test --if-present
      - run: npm run build --if-present

      # Ships source, build output, and the lockfile; node_modules is installed on the server.
      # Add or remove paths to match your app (e.g. `.next` for Next.js, `dist` for a compiled API).
      - name: Package the release
        run: |
          paths=(package.json package-lock.json)
          for p in .next dist public src server ecosystem.config.cjs next.config.js next.config.mjs next.config.ts; do
            [[ -e "$p" ]] && paths+=("$p")
          done
          tar -czf release.tar.gz --exclude='.next/cache' "${paths[@]}"

      - name: Set up SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Upload and deploy
        env:
          TARGET: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
        run: |
          SSH="ssh -i ~/.ssh/deploy_key"
          ARCHIVE="/tmp/${{ vars.APP_NAME }}-${{ github.sha }}.tar.gz"
          scp -i ~/.ssh/deploy_key release.tar.gz "$TARGET:$ARCHIVE"
          $SSH "$TARGET" "bin/deploy.sh --app '${{ vars.APP_NAME }}' --type node \
            --pm2-name '${{ vars.PM2_NAME || vars.APP_NAME }}' \
            --archive '$ARCHIVE' \
            ${{ vars.HEALTH_URL && format('--health-url ''{0}''', vars.HEALTH_URL) || '' }} \
            && rm -f '$ARCHIVE'"
