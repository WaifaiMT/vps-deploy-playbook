name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck scripts/*.sh test/*.sh
      - name: Deploy and rollback test
        run: bash test/deploy-test.sh

  nginx:
    name: Nginx templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: nginx -t on every template
        run: |
          for site in nginx/*.conf; do
            echo "::group::$site"
            docker run --rm \
              -v "$PWD/nginx/snippets:/etc/nginx/snippets:ro" \
              -v "$PWD/nginx/conf.d/connection-upgrade.conf:/etc/nginx/conf.d/connection-upgrade.conf:ro" \
              -v "$PWD/$site:/etc/nginx/conf.d/site.conf:ro" \
              nginx:stable nginx -t
            echo "::endgroup::"
          done

  workflows:
    name: Workflow templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color workflows/*.yml .github/workflows/*.yml
