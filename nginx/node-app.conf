# Node.js or Next.js app running under PM2, behind Nginx as a reverse proxy.
# Copy to /etc/nginx/sites-available/<app>, replace example.com and the port,
# then: sudo ln -s /etc/nginx/sites-available/<app> /etc/nginx/sites-enabled/
# Needs conf.d/connection-upgrade.conf installed once per server.
# Run certbot afterwards to add HTTPS: sudo certbot --nginx -d example.com

upstream my_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    include /etc/nginx/snippets/security-headers.conf;

    client_max_body_size 10m;

    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://my_app;
        proxy_http_version 1.1;

        # WebSockets (Socket.IO, Next.js dev tools)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
    }
}
