# Shared security headers. Copy to /etc/nginx/snippets/security-headers.conf.
# Nginx drops inherited add_header lines inside any location that sets its own,
# so the site templates include this file again in those locations.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Enable after HTTPS works everywhere on the domain:
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
