# React (or any static) front-end plus a Node.js API on the same domain:
#   https://example.com/        -> static files from /var/www/my-web/current
#   https://example.com/api/... -> Node.js API on port 5000
# Same-origin API calls mean no CORS configuration is needed.
# Needs conf.d/connection-upgrade.conf installed once per server.

upstream my_api {
    server 127.0.0.1:5000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    root /var/www/my-web/current;
    index index.html;

    include /etc/nginx/snippets/security-headers.conf;

    client_max_body_size 10m;

    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://my_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
