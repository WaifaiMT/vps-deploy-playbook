# Static site or single-page app (React, Vite, Astro) served straight from disk.
# Copy to /etc/nginx/sites-available/<app>, replace example.com and my-app,
# then: sudo ln -s /etc/nginx/sites-available/<app> /etc/nginx/sites-enabled/
# Run certbot afterwards to add HTTPS: sudo certbot --nginx -d example.com -d www.example.com

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    # deploy.sh points `current` at the latest release
    root /var/www/my-app/current;
    index index.html;

    include /etc/nginx/snippets/security-headers.conf;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Hashed build assets never change, so cache them for a year
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Single-page app routing: unknown paths fall back to index.html
    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
